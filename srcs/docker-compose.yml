services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    expose:
      - "3306"
    env_file:
      - .env
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    expose:
      - "9000"
    ports:
      - "443:443"
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    env_file:
      - .env
    networks:
      - inception

networks:
  inception:
    driver: bridge

