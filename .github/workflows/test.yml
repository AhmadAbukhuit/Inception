name: Test Docker Compose

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-compose:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Prepare environment variables
      run: cp srcs/.env.example srcs/.env

    - name: Build docker-compose services
      working-directory: srcs
      run: docker compose build

    - name: Start docker-compose services
      working-directory: srcs
      run: docker compose up -d

    - name: Wait for services to initialize
      run: sleep 10

    - name: Check container statuses
      working-directory: srcs
      run: |
        docker compose ps
        
        # Check if any container has exited
        EXITED_CONTAINERS=$(docker compose ps -a | grep -i "exited" | wc -l)
        if [ "$EXITED_CONTAINERS" -gt 0 ]; then
          echo "Error: One or more containers exited unexpectedly."
          docker compose logs
          exit 1
        fi

        # Check if no containers are running
        RUNNING_CONTAINERS=$(docker compose ps -q | wc -l)
        if [ "$RUNNING_CONTAINERS" -eq 0 ]; then
          echo "Error: No containers are running."
          exit 1
        fi
        
        echo "All containers are running successfully."
